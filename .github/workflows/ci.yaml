name: Continuous Integration

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run automated tests
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

  security:
    name: Filesystem Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve Maven dependencies
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress dependency:resolve

      - name: Scan for exposed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.76.2"
          scan-type: "fs"
          scan-ref: "."
          scanners: "secret"
          format: "json"
          output: "/dev/null"
          exit-code: "1"
          cache: "false"

      - name: Scan project dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "json"
          output: "trivy-fs.json"
          exit-code: "0"
          ignore-unfixed: false
          skip-setup-trivy: true
          cache: "false"

      - name: Enforce vulnerability policy
        shell: bash
        run: |
          jq -r '.Results[] | .Vulnerabilities[]? | [.Severity, .VulnerabilityID, .PkgName, .InstalledVersion, .FixedVersion] | @tsv' trivy-fs.json

          jq -e '(.Results | type == "array" and length > 0) and ([.Results[] | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0)' trivy-fs.json
