name: Build & Push Backend Image

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Docker Image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Generate image version
        id: vars
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            docker.io/rizz404/portfolio-api:sha-${{ steps.vars.outputs.sha }}
            docker.io/rizz404/portfolio-api:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-image:
    name: Container Security Scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scan published Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.76.2"
          scan-type: "image"
          image-ref: "docker.io/rizz404/portfolio-api@${{ needs.build.outputs.digest }}"
          scanners: "vuln"
          format: "json"
          output: "trivy-image.json"
          exit-code: "0"
          ignore-unfixed: false
          cache: "false"

      - name: Enforce vulnerability policy
        shell: bash
        run: |
          jq -r '.Results[] | .Vulnerabilities[]? | [.Severity, .VulnerabilityID, .PkgName, .InstalledVersion, .FixedVersion] | @tsv' trivy-image.json

          jq -e '(.Results | type == "array" and length > 0) and ([.Results[] | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0)' trivy-image.json

  deploy-staging:
    name: Deploy to Staging
    needs: [build, scan-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: staging

    concurrency:
      group: portfolio-api-staging
      cancel-in-progress: false

    steps:
      - name: Deploy image to staging
        shell: bash
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}

        run: |
          set -Eeuo pipefail
          umask 077

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest" >&2
            exit 1
          fi

          CURRENT_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')

          if [[ "$TESTED_SHA" != "$CURRENT_SHA" ]]; then
            echo "Deployment refused: a newer commit exists on main."
            exit 1
          fi

          SSH_DIR=$(mktemp -d)
          trap 'rm -rf "$SSH_DIR"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" |
            tr -d '\r' > "$SSH_DIR/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" |
            tr -d '\r' > "$SSH_DIR/known_hosts"

          chmod 600 "$SSH_DIR/deploy_key"
          chmod 600 "$SSH_DIR/known_hosts"

          ssh \
            -i "$SSH_DIR/deploy_key" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o ConnectTimeout=15 \
            -l "$SSH_USER" \
            "$SSH_HOST" \
            "$IMAGE_DIGEST"

          echo "Staging deployment completed successfully."

          {
            echo "## Staging Deployment"
            echo ""
            echo "- Status: Success"
            echo "- Commit: \`$TESTED_SHA\`"
            echo "- Image: \`docker.io/rizz404/portfolio-api@$IMAGE_DIGEST\`"
            echo "- Health check: Passed"
            echo "- API smoke test: Passed"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create staging release manifest
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          jq -n \
            --arg commit "$TESTED_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{commit: $commit, digest: $digest, run_id: $run_id, run_attempt: $run_attempt, environment: "staging"}' > staged-release.json

      - name: Upload staging release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staged-release-${{ github.run_attempt }}
          path: staged-release.json
          retention-days: 30
          if-no-files-found: error
