name: Build & Push Backend Image

on:
  push:
    branches: [main] # trigger tiap push ke main, gak perlu mikir tag manual, edisi malas buat version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Ambil short SHA buat tag image
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Personal Access Token docker hub

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # dua tag: SHA buat jejak versi persis (bisa rollback), "latest" buat yang males milih
          tags: |
            docker.io/rizz404/portfolio-api:${{ steps.vars.outputs.tag }}
            docker.io/rizz404/portfolio-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # * Deploy ke newest server: SSH lalu jalanin scripts/deploy.sh (git pull + pull image tag SHA + up).
      # * Di-skip otomatis kalau secret NEWEST_DEPLOY_* belum di-set, jadi push tetap cuma build & push.
      - name: Deploy ke newest server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.NEWEST_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.NEWEST_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.NEWEST_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.NEWEST_DEPLOY_USER }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::NEWEST_DEPLOY_* belum di-set, deploy di-skip"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "/opt/portfolio-api/scripts/deploy.sh $TAG"
