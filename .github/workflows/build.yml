name: Build & Push Backend Image

on:
  push:
    branches: [main] # trigger tiap push ke main, gak perlu mikir tag manual, edisi malas buat version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Ambil short SHA buat tag image
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Personal Access Token docker hub

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # dua tag: SHA buat jejak versi persis (bisa rollback), "latest" buat yang males milih
          tags: |
            docker.io/rizz404/portfolio-api:${{ steps.vars.outputs.tag }}
            docker.io/rizz404/portfolio-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy stack di Portainer
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PORTAINER_WEBHOOK_ID: ${{ secrets.PORTAINER_WEBHOOK_ID }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl --fail-with-body --silent --show-error -X POST 'http://127.0.0.1:9000/api/stacks/webhooks/$PORTAINER_WEBHOOK_ID'"
