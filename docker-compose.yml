services:
  db:
    image: docker.io/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 512m

  redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 128m

  backend:
    # * Image dibuild CI & di-push ke Docker Hub; server cuma pull. BACKEND_IMAGE di-set ke tag SHA
    # * lewat scripts/deploy.sh biar versi yang jalan selalu bisa dilacak & di-rollback.
    image: ${BACKEND_IMAGE:-docker.io/rizz404/portfolio-api:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # * redis cuma butuh container-nya kelar start, gak wajib "healthy" -- biar backend tetep
      # * bisa jalan meski redis lagi bermasalah/down (lihat MANAGEMENT_HEALTH_REDIS_ENABLED di
      # * bawah, di-set false biar /actuator/health -- yang dipakai Dockerfile HEALTHCHECK -- gak
      # * ikut DOWN gara-gara redis).
      redis:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}?user=${DB_USER}&password=${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # * true: status redis tetap dilaporkan di /actuator/health kalau dia hidup. Container ini
      # * gak kena imbas kalau redis down karena Dockerfile HEALTHCHECK ngecek grup "core" yang
      # * sengaja exclude redis (lihat application.properties).
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
      # * APP_PORT juga dipakai app buat nentuin server.port (lihat ENTRYPOINT di Dockerfile),
      # * jadi host port & port yang didengerin Spring ikut berubah bareng kalau di-override.
      APP_PORT: ${APP_PORT:-8080}
    # * Default bind ke loopback: akses publik lewat reverse proxy (Plesk/nginx). Set APP_BIND=0.0.0.0
    # * di .env kalau memang mau diekspos langsung.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:${APP_PORT:-8080}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    mem_limit: 512m
    cpus: 1.0

volumes:
  db_data_pg18:
  redis_data:
