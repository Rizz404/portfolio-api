spring.application.name=portfolio-api

spring.datasource.url=${DB_URL}

spring.flyway.enabled=true

server.servlet.context-path=/api/v1

spring.profiles.active=dev

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# * Rate limiting: maksimal `capacity` request per client (per IP) dalam rentang `window-seconds`.
# * Kalau terlampaui, response 429 Too Many Requests + header Retry-After.
app.rate-limit.capacity=100
app.rate-limit.window-seconds=60
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}
spring.jpa.open-in-view=false
