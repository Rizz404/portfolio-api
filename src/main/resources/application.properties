spring.application.name=portfolio-api

spring.datasource.url=${DB_URL}

spring.flyway.enabled=true

server.servlet.context-path=/api/v1

spring.profiles.active=dev

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# * Rate limiting: maksimal `capacity` request per client (per IP) dalam rentang `window-seconds`.
# * Kalau terlampaui, response 429 Too Many Requests + header Retry-After.
app.rate-limit.capacity=100
app.rate-limit.window-seconds=60
cloudinary.cloud.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api.key=${CLOUDINARY_API_KEY}
cloudinary.api.secret=${CLOUDINARY_API_SECRET}
spring.jpa.open-in-view=false

# * Batasan upload file: max ukuran per file & max jumlah file dalam satu request upload banyak
# * (mis. blog attachments, project images, use pictures). Divalidasi lagi di FileUploadService
# * biar pesan error-nya jelas (bukan cuma ditolak mentah-mentah oleh Tomcat).
app.upload.max-file-size-mb=10
app.upload.max-files-per-request=10

# * Batas request multipart di level servlet, dikasih buffer dari (max-file-size x max-files)
# * biar gak jadi bottleneck duluan sebelum validasi custom di atas sempat jalan.
spring.servlet.multipart.max-file-size=${app.upload.max-file-size-mb}MB
spring.servlet.multipart.max-request-size=120MB

# * Redis dipakai sebagai cache layer buat endpoint publik yang sering di-GET tapi jarang berubah
# * (lihat @Cacheable di Skill/Use/Project/Experience/BlogService serta CacheConfig). Sifatnya
# * tetap optional: connect/command timeout dibikin pendek biar kalau Redis-nya mati, request gak
# * ikut nge-hang lama nunggu koneksi gagal (CacheErrorHandler di CacheConfig yang nangkep
# * error-nya supaya fallback ke DB, bukan ikut 500).
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# * Statusnya tetap dilaporkan di /actuator/health kalau Redis hidup (buat visibility), tapi TIDAK
# * dimasukkan ke grup "core" di bawah. Dockerfile HEALTHCHECK ngecek grup "core", bukan root
# * /actuator/health, biar Redis down gak bikin container backend ke-flag unhealthy/restart.
management.health.redis.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.core.include=*
management.endpoint.health.group.core.exclude=redis
