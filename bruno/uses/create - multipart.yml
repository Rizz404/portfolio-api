info:
  name: create - multipart
  type: http
  seq: 9

http:
  method: POST
  url: "{{BASE_URL}}/uses"
  body:
    type: multipart-form
    data:
      - type: text
        name: data
        contentType: application/json
        value: |-
          {
            "itemName": "Multipart Upload Test Tool",
            "category": "software",
            "links": ["https://example.com/multipart-test-tool"],
            "translations": [
              { "locale": "en", "reasons": "Created via multipart/form-data with a real logo and picture files." }
            ]
          }
      - type: file
        name: logoFile
        value:
          - fixtures/sample-1.jpg
      - type: file
        name: pictureFiles
        value:
          - fixtures/sample-1.jpg
          - fixtures/sample-2.jpg
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should create the use and return 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("logoFile and pictureFiles should be uploaded to Cloudinary and returned as URLs", function () {
          const body = res.getBody();
          expect(body.data).to.have.property("id");
          expect(body.data.logoUrl).to.be.a("string").and.not.empty;
          expect(body.data.pictures).to.be.an("array").with.lengthOf(2);
          body.data.pictures.forEach((url) => expect(url).to.be.a("string").and.not.empty);

          bru.setVar("useMultipartId", body.data.id);
          bru.setVar("useMultipartPictureUrlToDelete", body.data.pictures[0]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Exercises UseController.createUseMultipart, which is untouched by `create` (that one
  only hits createUseJson). The "data" text part must be sent with
  contentType: application/json, otherwise Spring can't deserialize the
  @RequestPart("data") UseRequest - including its required `translations` array.

  Actually uploads fixtures/sample-1.jpg and fixtures/sample-2.jpg to Cloudinary.
  Cleaned up (including the Cloudinary files) by
  `cleanup - delete multipart fixture`.
