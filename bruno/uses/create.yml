info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/uses"
  body:
    type: json
    data: |-
      {
        "itemName": "Visual Studio Code",
        "category": "software",
        "logoUrl": "https://example.com/images/vscode-logo.png",
        "pictures": [
          "https://example.com/images/vscode-1.png"
        ],
        "links": [
          "https://code.visualstudio.com"
        ],
        "translations": [
          { "locale": "en", "reasons": "Main daily-driver editor - lightweight and extensible." },
          { "locale": "id", "reasons": "Editor utama untuk sehari-hari coding, ringan dan extensible." }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should create the use and return 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("response body should contain the generated id and submitted fields", function () {
          const body = res.getBody();
          expect(body.data).to.have.property("id");
          expect(body.data.itemName).to.equal("Visual Studio Code");
          expect(body.data.category).to.equal("software");

          bru.setVar("useId", body.data.id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  UseRequest keeps itemName/category flat, but `reasons` moved into a required
  `translations` array (at least "en"). UseResponse flattens the resolved locale's
  reasons back into a top-level `reasons` field.

  Controllers wrap success payloads in SuccessResponse, so the created use lives
  under `body.data`, not the root.
