info:
  name: get all
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/users"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("default (offset) pagination should return the page content under data/pagination", function () {
          const body = res.getBody();
          expect(body).to.have.property("data").that.is.an("array");
          expect(body).to.have.property("pagination");
          expect(body.pagination).to.have.property("total");
          expect(body.pagination).to.have.property("totalPages");
          expect(body.pagination).to.have.property("currentPage");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The item list is under `data` and the paging metadata under `pagination`
  (PagedResponse), not a raw Spring Page object at the root.
