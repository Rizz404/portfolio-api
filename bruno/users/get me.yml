info:
  name: get me
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/users/me"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("response body should describe whichever account owns the current TOKEN", function () {
          const body = res.getBody();
          expect(body.data).to.have.property("id");
          expect(body.data).to.have.property("email");

          // Captured as a baseline for `update me - json`/`update me - multipart`, not
          // hardcoded, since this could be any account depending on which folder set
          // the shared TOKEN last.
          bru.setVar("meUserId", body.data.id);
          bru.setVar("meEmail", body.data.email);
          bru.setVar("mePreviousRole", body.data.role);
          bru.setVar("mePreviousProvider", body.data.provider);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  UserController.findCurrentUser resolves the user via @AuthenticationPrincipal from
  the JWT the request carries (the collection's shared `TOKEN`), not a path variable -
  so this returns whichever account is currently authenticated, not the Budi fixture
  from `setup - register fixture user`.

  Requires a valid TOKEN to already be set, e.g. by running auth/register or
  auth/login first in this session.
