info:
  name: get all
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/projects"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("default (offset) pagination should return the page content under data/pagination", function () {
          const body = res.getBody();
          expect(body).to.have.property("data").that.is.an("array");
          expect(body).to.have.property("pagination");
          expect(body.pagination).to.have.property("total");
          expect(body.pagination).to.have.property("totalPages");
          expect(body.pagination).to.have.property("currentPage");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  findAllProjects wraps the Spring Data Page in PagedResponse: the item list is under
  `data` and the paging metadata (total/perPage/currentPage/totalPages/hasPrevPage/
  hasNextPage) is under `pagination` - not a raw Spring Page object at the root.
