info:
  name: create - validation error
  type: http
  seq: 9

http:
  method: POST
  url: "{{BASE_URL}}/projects"
  body:
    type: json
    data: |-
      {
        "translations": [],
        "status": null,
        "logoUrl": null,
        "imageUrls": [],
        "projectLinks": {}
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("an empty translations list and missing status should be rejected with 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("validation error should flag the missing fields", function () {
          const body = res.getBody();
          expect(body.status).to.equal("error");
          expect(body.message).to.equal("Validation failed");
          expect(body.error).to.have.property("translations");
          expect(body.error).to.have.property("status");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ProjectRequest.translations is @NotEmpty and status is @NotNull; every
  create/update controller method in this collection is now annotated @Valid, but
  this is still the clearest resource to exercise a validation failure on since it
  has no other required fields to accidentally satisfy.
