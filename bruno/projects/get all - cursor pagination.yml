info:
  name: get all - cursor pagination
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/projects"
  params:
    - name: cursor
      value: "1"
      type: query
      disabled: false
    - name: size
      value: "5"
      type: query
      disabled: false
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("cursor pagination should return the item list under data, with cursor metadata (not pagination)", function () {
          const body = res.getBody();
          expect(body.data).to.be.an("array");
          expect(body).to.have.property("cursor");
          expect(body).to.not.have.property("pagination");
          expect(body.cursor).to.have.property("hasNextPage");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Both offset and cursor pagination put the item list under `body.data` - the
  difference is the sibling metadata key: `pagination` (PagingInfo) for offset,
  `cursor` (CursorInfo: nextCursor/perPage/hasNextPage) for cursor-based paging.
