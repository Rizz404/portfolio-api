info:
  name: get by id - not found
  type: http
  seq: 8

http:
  method: GET
  url: "{{BASE_URL}}/projects/{{projectId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("a deleted/unknown project id is rejected with 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("error message should mention the missing id", function () {
          const body = res.getBody();
          expect(body.status).to.equal("error");
          expect(body.message).to.include("not found");
          expect(body.message).to.include(String(bru.getVar("projectId")));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ProjectService throws NoSuchElementException when a project is missing, and
  GlobalExceptionHandler.handleNotFoundException now maps that to 404 (was an
  unhandled 500 before the handler was added).

  Depends on `delete by id` having run first in this run/session so `projectId` no
  longer exists.
