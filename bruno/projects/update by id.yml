info:
  name: update by id
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{BASE_URL}}/projects/{{projectId}}"
  body:
    type: json
    data: |-
      {
        "translations": [
          {
            "locale": "en",
            "name": "Vue 4 Portfolio Dashboard",
            "description": "Dashboard v4 with performance and UI improvements."
          }
        ],
        "status": "development",
        "logoUrl": "https://example.com/images/vue-logo-v4.png",
        "imageUrls": [
          "https://example.com/images/dash-v4-1.png"
        ],
        "projectLinks": {
          "github": "https://github.com/rizqiansyah/vue-portfolio"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("project should reflect the updated fields and regenerated slug", function () {
          const body = res.getBody();
          expect(body.data.id).to.equal(bru.getVar("projectId"));
          expect(body.data.name).to.equal("Vue 4 Portfolio Dashboard");
          expect(body.data.status).to.equal("development");
          expect(body.data.slug).to.equal("vue-4-portfolio-dashboard");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ProjectController does not apply @Valid on update... actually it does now
  (@Valid @RequestPart/@RequestBody ProjectRequest), but the mapper still
  overwrites every field with no null-ignore strategy, and reconcileTranslations
  replaces translations by locale rather than merging, so send the full body here
  (including every locale you want to keep) rather than a partial patch.
