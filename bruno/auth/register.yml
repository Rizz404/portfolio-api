info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "rizky.tester@example.com",
        "password": "SuperSecret123!",
        "confirmPassword": "SuperSecret123!",
        "nickname": "Rizky"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody()

        if (data && data.data.token){
          bru.setEnvVar("TOKEN", data.data.token)
          console.log("Get token success")
        } else{
          console.log("Get token failed")
        }
    - type: tests
      code: |-
        test("should register the user and return 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("response body should contain a token and the created user", function () {
          const body = res.getBody();
          expect(body.data).to.have.property("token");
          expect(body.data.user).to.have.property("id");
          expect(body.data.user.email).to.equal("rizky.tester@example.com");

          bru.setVar("accessToken", body.data.token);
          bru.setVar("authUserId", body.data.user.id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Controllers wrap every success payload in SuccessResponse ({status, message, data}),
  so the actual token/user live under `body.data`, not the root - `body.token`/
  `body.user` would silently be undefined.

  Also sets the `TOKEN` environment variable (read by the collection's root-level
  bearer auth, see opencollection.yml) via the after-response script, so every other
  request using `auth: inherit` becomes authenticated once this request has run.
  `accessToken`/`authUserId` are separate collection variables kept only for reference
  by other requests in this folder (e.g. `cleanup - delete registered user`).

  Re-running this request will fail (see `register - duplicate email`) unless
  `cleanup - delete registered user` removed the user from the previous run first.
