info:
  name: login - invalid credentials
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "rizky.tester@example.com",
        "password": "WrongPassword!"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("a wrong password is rejected with 401", function () {
          expect(res.getStatus()).to.equal(401);
        });

        test("error message should not leak whether the email or password was wrong", function () {
          const body = res.getBody();
          expect(body.status).to.equal("error");
          expect(body.message).to.equal("Invalid email or password");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  AuthService.login calls AuthenticationManager.authenticate directly, which throws
  BadCredentialsException (an AuthenticationException). GlobalExceptionHandler now
  catches AuthenticationException and returns a generalized 401 message instead of
  letting it bubble up as an unhandled 500.

  Depends on `register` having run first in this run/session to create the account.
