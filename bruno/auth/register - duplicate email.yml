info:
  name: register - duplicate email
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "rizky.tester@example.com",
        "password": "SuperSecret123!",
        "confirmPassword": "SuperSecret123!",
        "nickname": "Rizky"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("registering an already-used email is rejected with 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("error message should mention the email is already used", function () {
          const body = res.getBody();
          expect(body.status).to.equal("error");
          expect(body.message).to.equal("Email has been used");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  AuthService.register throws IllegalArgumentException("Email has been used"), which
  GlobalExceptionHandler.handleIllegalArgumentException now maps to 400 (was an
  unhandled 500 before the handler was added).

  Depends on `register` having run first in this run/session so the email exists.
