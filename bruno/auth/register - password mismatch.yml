info:
  name: register - password mismatch
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "mismatch.tester@example.com",
        "password": "SuperSecret123!",
        "confirmPassword": "DoesNotMatch!",
        "nickname": "Mismatch"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("a mismatched confirmPassword is rejected with 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("validation error should flag the password mismatch", function () {
          const body = res.getBody();
          expect(body.status).to.equal("error");
          expect(body.message).to.equal("Validation failed");
          expect(body.error).to.have.property("passwordConfirmed");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  RegisterRequest.isPasswordConfirmed() is a @AssertTrue on the record itself, and
  AuthController.register is annotated @Valid, so a mismatched confirmPassword now
  fails Bean Validation before AuthService ever runs and is rejected with 400 via
  GlobalExceptionHandler.handleValidationException. Hibernate Validator derives the
  field-error key "passwordConfirmed" from the isPasswordConfirmed() method name.

  AuthService still has its own IllegalArgumentException("Password and Confirm
  Password do not match") check, but it is now unreachable dead code for this
  controller path since @Valid rejects the request first.
