info:
  name: refresh
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASE_URL}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody()

        if (data && data.data.token){
          bru.setEnvVar("TOKEN", data.data.token)
          console.log("Refresh token success")
        } else{
          console.log("Refresh token failed")
        }
    - type: tests
      code: |-
        test("should refresh and return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("response body should contain a new access token and a new refresh token", function () {
          const body = res.getBody();
          expect(body.data).to.have.property("token");
          expect(body.data).to.have.property("refreshToken");
          expect(body.data.user.email).to.equal("rizky.tester@example.com");

          bru.setVar("accessToken", body.data.token);
          bru.setVar("refreshToken", body.data.refreshToken);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Exchanges the refresh token issued by `login` for a fresh access+refresh token pair
  (AuthService#refresh), no password required. Rotates `refreshToken` in this
  collection - the previous refresh token still works until its own expiry though,
  since refresh tokens are stateless JWTs with no DB-backed revocation (see
  JwtService/AuthService comments for that trade-off).

  Depends on `login` having run first in this run/session to populate `refreshToken`.
