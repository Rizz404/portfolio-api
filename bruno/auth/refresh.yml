info:
  name: refresh
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASE_URL}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody()

        if (data && data.data.token){
          bru.setEnvVar("TOKEN", data.data.token)
          console.log("Refresh token success")
        } else{
          console.log("Refresh token failed")
        }
    - type: tests
      code: |-
        test("should refresh and return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("response body should contain a new access token and the SAME refresh token", function () {
          const body = res.getBody();
          expect(body.data).to.have.property("token");
          expect(body.data.refreshToken).to.equal(bru.getVar("refreshToken"));
          expect(body.data.user.email).to.equal("rizky.tester@example.com");

          bru.setVar("accessToken", body.data.token);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Exchanges the refresh token issued by `login` for a new access token
  (AuthService#refresh), no password required. The refresh token is returned
  UNCHANGED (not rotated) - since it's a stateless JWT with no DB-backed revocation,
  rotating it on every call would just reset its expiry and let a session extend
  itself forever as long as it's used at least once within any refresh-token window.
  Returning the same token instead means the session has a hard ceiling: once the
  original refresh token (issued at login/register) expires, the client must log in
  with a password again.

  Depends on `login` having run first in this run/session to populate `refreshToken`.
