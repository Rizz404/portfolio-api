info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/experiences"
  body:
    type: json
    data: |-
      {
        "companyName": "PT Teknologi Nusantara",
        "startDate": "2023-01-15",
        "endDate": null,
        "isCurrent": true,
        "translations": [
          {
            "locale": "en",
            "position": "Backend Engineer",
            "description": "Developing and maintaining backend services built with Spring Boot.",
            "jobdesks": ["Building REST APIs", "Database query optimization"]
          },
          {
            "locale": "id",
            "position": "Backend Engineer",
            "description": "Mengembangkan dan memelihara layanan backend berbasis Spring Boot.",
            "jobdesks": ["Membangun REST API", "Optimasi query database"]
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should create the experience and return 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("response body should contain the generated id and submitted fields", function () {
          const body = res.getBody();
          expect(body.data).to.have.property("id");
          expect(body.data.companyName).to.equal("PT Teknologi Nusantara");
          expect(body.data.isCurrent).to.equal(true);

          bru.setVar("experienceId", body.data.id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ExperienceRequest keeps companyName/startDate/endDate/isCurrent flat, but
  position/description/jobdesks moved into a required `translations` array (at
  least "en"). ExperienceResponse flattens the resolved locale's fields back to
  the top level.

  Controllers wrap success payloads in SuccessResponse, so the created experience
  lives under `body.data`, not the root.
