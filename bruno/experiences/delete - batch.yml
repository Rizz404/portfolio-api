info:
  name: delete - batch
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{BASE_URL}}/experiences/batch"
  body:
    type: json
    data: |-
      {
        "ids": [{{experienceBatchId1}}, {{experienceBatchId2}}]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("confirmation message should mention both deleted experiences", function () {
          const body = res.getBody();
          expect(String(body.data)).to.include("2");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Exercises ExperienceController.deleteExperienceBatch /
  ExperienceService.deleteExperienceBatch (DELETE /experiences/batch with a
  BatchDeleteRequest body). Depends on `setup - create batch fixture 1` and
  `setup - create batch fixture 2`.
