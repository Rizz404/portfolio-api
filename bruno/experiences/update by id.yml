info:
  name: update by id
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{BASE_URL}}/experiences/{{experienceId}}"
  body:
    type: json
    data: |-
      {
        "companyName": "PT Teknologi Nusantara",
        "startDate": "2023-01-15",
        "endDate": "2026-06-30",
        "isCurrent": false,
        "translations": [
          {
            "locale": "en",
            "position": "Senior Backend Engineer",
            "description": "Promoted, now leading the backend team.",
            "jobdesks": ["Building REST APIs", "Code review", "Mentoring junior engineers"]
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("experience should reflect the updated fields", function () {
          const body = res.getBody();
          expect(body.data.id).to.equal(bru.getVar("experienceId"));
          expect(body.data.position).to.equal("Senior Backend Engineer");
          expect(body.data.isCurrent).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ExperienceController does apply @Valid on update, but the mapper still overwrites
  every field and translations are reconciled by locale, so send the full body here
  rather than a partial patch.
