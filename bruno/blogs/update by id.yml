info:
  name: update by id
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{BASE_URL}}/blogs/{{blogId}}"
  body:
    type: json
    data: |-
      {
        "featuredImageUrl": "https://example.com/images/spring-boot-3-v2.png",
        "isPublished": true,
        "viewsCount": 10,
        "likesCount": 2,
        "dislikesCount": 0,
        "translations": [
          {
            "locale": "en",
            "title": "Learning Spring Boot 3 from Scratch (Updated)",
            "content": "Revised article with the latest code examples."
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("blog should reflect the updated fields and regenerated slug", function () {
          const body = res.getBody();
          expect(body.data.id).to.equal(bru.getVar("blogId"));
          expect(body.data.title).to.equal("Learning Spring Boot 3 from Scratch (Updated)");
          expect(body.data.slug).to.equal("learning-spring-boot-3-from-scratch-updated");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  BlogController does apply @Valid on update, but the mapper still overwrites every
  field and translations are reconciled by locale, so send the full body here rather
  than a partial patch.
