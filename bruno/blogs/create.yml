info:
  name: create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/blogs"
  body:
    type: json
    data: |-
      {
        "featuredImageUrl": "https://example.com/images/spring-boot-3.png",
        "isPublished": true,
        "viewsCount": 0,
        "likesCount": 0,
        "dislikesCount": 0,
        "translations": [
          {
            "locale": "en",
            "title": "Learning Spring Boot 3 from Scratch",
            "content": "This article covers the basics of Spring Boot 3 for beginners."
          },
          {
            "locale": "id",
            "title": "Belajar Spring Boot 3 dari Nol",
            "content": "Artikel ini membahas dasar-dasar Spring Boot 3 untuk pemula."
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should create the blog and return 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("response body should contain the generated id, slug and submitted fields", function () {
          const body = res.getBody();
          expect(body.data).to.have.property("id");
          expect(body.data).to.have.property("slug");
          expect(body.data.title).to.equal("Learning Spring Boot 3 from Scratch");
          expect(body.data.isPublished).to.equal(true);

          bru.setVar("blogId", body.data.id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  BlogRequest's URL field is `featuredImageUrl` (the old body sent `featuredImage`,
  which doesn't exist on the DTO and was silently ignored by Jackson). title/content
  moved into a required `translations` array (at least "en"); BlogResponse flattens
  the resolved locale's title/content and still exposes the image url as
  `featuredImage`.

  Controllers wrap success payloads in SuccessResponse, so the created blog lives
  under `body.data`, not the root.
