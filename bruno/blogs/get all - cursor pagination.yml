info:
  name: get all - cursor pagination
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/blogs"
  params:
    - name: cursor
      value: "1"
      type: query
      disabled: false
    - name: size
      value: "5"
      type: query
      disabled: false
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("cursor pagination should return the item list under data, with cursor metadata", function () {
          const body = res.getBody();
          expect(body.data).to.be.an("array");
          expect(body).to.have.property("cursor");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
