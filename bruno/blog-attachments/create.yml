info:
  name: create
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/blog-attachments"
  body:
    type: json
    data: |-
      {
        "blogId": {{attachmentParentBlogId}},
        "fileName": "architecture-diagram.png",
        "fileUrl": "https://example.com/files/architecture-diagram.png",
        "fileType": "image"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should create the blog attachment and return 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("response body should contain the generated id and submitted fields", function () {
          const body = res.getBody();
          expect(body.data).to.have.property("id");
          expect(body.data.blogId).to.equal(bru.getVar("attachmentParentBlogId"));
          expect(body.data.fileName).to.equal("architecture-diagram.png");
          expect(body.data.fileType).to.equal("image");

          bru.setVar("blogAttachmentId", body.data.id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  BlogAttachmentRequest.fileType is BlogAttachment.FileType (image|document|video|
  audio|archive|other), not a MIME type string - "image/png" doesn't match any enum
  constant and fails Jackson deserialization.

  Controllers wrap success payloads in SuccessResponse, so the created attachment
  lives under `body.data`, not the root.
