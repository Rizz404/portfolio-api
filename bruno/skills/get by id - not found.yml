info:
  name: get by id - not found
  type: http
  seq: 8

http:
  method: GET
  url: "{{BASE_URL}}/skills/{{skillId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("a deleted/unknown skill id is rejected with 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("error message should mention the missing id", function () {
          const body = res.getBody();
          expect(body.status).to.equal("error");
          expect(body.message).to.include("not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  SkillService throws NoSuchElementException when a skill is missing, which
  GlobalExceptionHandler.handleNotFoundException maps to 404.

  Depends on `delete by id` having run first in this run/session so `skillId` no
  longer exists.
