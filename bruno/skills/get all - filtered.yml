info:
  name: get all - filtered
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/skills"
  params:
    - name: search
      value: Spring
      type: query
      disabled: false
    - name: category
      value: framework
      type: query
      disabled: false
    - name: sortBy
      value: name
      type: query
      disabled: false
    - name: sortDir
      value: asc
      type: query
      disabled: false
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("results should only contain matching, framework category skills", function () {
          const body = res.getBody();
          expect(body.data).to.be.an("array");
          body.data.forEach((skill) => {
            expect(skill.category).to.equal("framework");
            expect(skill.name.toLowerCase()).to.include("spring");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
